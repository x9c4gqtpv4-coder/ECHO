[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-color-standardizer"
version = "0.6.0"
description = "ECHO: reference-guided color consistency for fashion SKU image sets"
readme = "README.md"
license = "MIT"
keywords = ["color-transfer", "color-standardization", "fashion", "comfyui", "image-processing"]
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
semantic = [
  "mediapipe==1.0.1",
]
fine-semantic = [
  "torch>=2.5,<3",
  "transformers>=4.48,<5",
  "safetensors>=0.5,<1",
]

[project.scripts]
batch-color = "batch_color.cli:main"

[project.urls]
Homepage = "https://github.com/x9c4gqtpv4-coder/ECHO"
Repository = "https://github.com/x9c4gqtpv4-coder/ECHO"
Issues = "https://github.com/x9c4gqtpv4-coder/ECHO/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.comfy]
PublisherId = "sysyou"
DisplayName = "ECHO · 回响"
